[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evalport-sdk"
# This is the PACKAGE release version (ordinary semver for the SDK code itself),
# a distinct axis from openeval.types.OPENEVAL_VERSION (which spec revision this
# SDK targets/stamps into generated documents, now 1.0.0-rc.5). Bumped
# 1.0.0 -> 1.1.0 (MINOR, not a prerelease) for three backward-compatible fixes:
# semver 2.0.0 acceptance in `version` fields, open (non-enum) grader `type` with
# params.handler for non-standard types, and enforcement of the [0,1] score range
# already declared by resultset.json but previously unchecked in this validator.
# Bumped again 1.1.0 -> 1.2.0 (MINOR) for the 1.0.0-rc.3 spec changes: a new
# optional `Result.completed_at` field (backward-compatible schema addition,
# Discussion #10) plus the OPENEVAL_VERSION drift fix (was stuck at
# "1.0.0-rc.1" while the spec had already moved to "1.0.0-rc.2" -- now correctly
# tracks "1.0.0-rc.3"). Neither change removes or narrows any existing field, so
# this stays MINOR, not MAJOR.
# Bumped again 1.2.0 -> 1.3.0 (MINOR) for the 1.0.0-rc.5 spec change (Discussion
# #22 / issue #20, repetition/attempt tracking): new optional `Result.attempt`
# (int >= 1) and `ResultSet.isolation` (open string, declared once per
# ResultSet -- see spec/SPEC.md Extension Mechanism -> Repetition & Attempt
# Tracking) fields, plus a validate_result_set() rule rejecting a duplicate
# (test_case_id, run_id, attempt). Additive and backward-compatible: an
# existing ResultSet with no attempt/isolation fields is untouched and stays
# fully valid, so this stays MINOR, not MAJOR.
# Bumped again 1.3.0 -> 1.3.1 (PATCH, code-identical to 1.3.0) on 2026-09-02:
# v1.3.0's GitHub Release published this package to PyPI successfully, but the
# matching sdk/typescript 1.3.0 failed npm's OIDC provenance check (missing
# package.json `repository` field) and was never actually published to npm --
# see that package's own changelog note. Since PyPI treats a version as
# immutable once uploaded (1.3.0 can't be re-pushed with a fix), this package
# is bumped in lockstep to 1.3.1 purely so both SDKs carry the same version
# number across both registries, matching this repo's existing convention of
# always bumping sdk/python and sdk/typescript together. No schema, validator,
# or OPENEVAL_VERSION change in this bump.
# Deliberately NOT a prerelease tag like "1.0.0-rc.1": all 30 shipped adapters
# under adapters/ declare `evalport-sdk>=1.0.0`, and a prerelease identifier
# sorts BELOW its base version in both PEP 440 and semver -- publishing a
# prerelease-tagged package version would make pip reject it against every
# adapter's own dependency constraint. Verified with
# `packaging.specifiers.SpecifierSet('>=1.0.0')` before making this choice.
# As of the 1.3.1 bump, both PyPI and npm now publish automatically via GitHub
# Actions OIDC Trusted Publishing on every GitHub Release -- no manual
# `twine upload`/`npm publish` or stored token needed (see MANUAL-ACTIONS.md).
version = "1.3.1"
description = "Python SDK for EvalPort — The Open Evaluation Standard"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Repository = "https://github.com/adhabnr-ux/evalport"
Documentation = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"
Issues = "https://github.com/adhabnr-ux/evalport/issues"

[project.optional-dependencies]
# jsonschema is used only by tests/test_schema_consistency.py, which cross-checks
# spec/schemas/*.json (the portable JSON Schema source of truth) against this
# package's zero-dependency hand-rolled validators to guard against the two
# validation paths silently drifting apart. The core `openeval` package itself
# has zero runtime dependencies.
test = ["pytest", "jsonschema"]

[tool.setuptools.packages.find]
where = ["."]
