name: EvalPort validate
description: Validate EvalPort documents (eval suites, test cases, graders, result sets) and annotate invalid files on the pull request.
author: EvalPort

branding:
  icon: check-circle
  color: green

inputs:
  files:
    description: >-
      Files, directories or glob patterns to validate, separated by spaces or
      newlines (paths containing spaces are not supported). Relative to the
      workspace. `**` recurses. A pattern that matches no files fails the step.
    required: false
    default: '**/*.evalport.json'
  type:
    description: Document type for every file -- auto (detect per file), suite, testcase, grader or resultset.
    required: false
    default: auto
  allow-unknown:
    description: >-
      PROPOSED (Discussion #108). 'true' accepts properties the schema does not
      define (no UNKNOWN_FIELD errors), for documents from a newer minor spec
      version. Default 'false': strict validation, where only metadata objects
      (and provider.extra, params, summary.by_grader entries) are open.
    required: false
    default: 'false'
  python-version:
    description: Python version passed to actions/setup-python.
    required: false
    default: '3.11'
  sdk-version:
    description: >-
      Which validator to install. `local` (default) installs sdk/python from
      this action's own checkout, so pinning `uses: adhabnr-ux/evalport@<ref>`
      pins the validator to that ref. `pypi` installs the latest evalport-sdk
      from PyPI; any other value is treated as an exact PyPI version
      (evalport-sdk==<value>). evalport-sdk 1.3.1 and earlier do not ship the
      evalport-validate CLI, so `pypi` only works once a later release exists.
    required: false
    default: local

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the EvalPort validator
      id: install
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
        ACTION_PATH: ${{ github.action_path }}
        VENV: ${{ runner.temp }}/evalport-validate-venv
      run: |
        set -euo pipefail
        case "$SDK_VERSION" in
          ''|local) spec="$ACTION_PATH/sdk/python" ;;
          pypi)     spec="evalport-sdk" ;;
          *)        spec="evalport-sdk==$SDK_VERSION" ;;
        esac
        # Private venv so the validator never touches the caller's own packages.
        python -m venv "$VENV"
        if [ -d "$VENV/Scripts" ]; then bin="$VENV/Scripts"; else bin="$VENV/bin"; fi
        "$bin/python" -m pip install --quiet --disable-pip-version-check "$spec"
        if [ ! -e "$bin/evalport-validate" ] && [ ! -e "$bin/evalport-validate.exe" ]; then
          installed=$("$bin/python" -m pip show evalport-sdk 2>/dev/null | sed -n 's/^Version: //p')
          echo "::error title=EvalPort::evalport-sdk ${installed:-?} (sdk-version: $SDK_VERSION) does not include the evalport-validate CLI. Use sdk-version: local, or a release newer than 1.3.1."
          exit 1
        fi
        echo "bin=$bin/evalport-validate" >> "$GITHUB_OUTPUT"
        echo "Installed: $("$bin/python" -m pip show evalport-sdk | sed -n 's/^Version: //p') from $spec"

    - name: Validate EvalPort documents
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        DOC_TYPE: ${{ inputs.type }}
        ALLOW_UNKNOWN: ${{ inputs.allow-unknown }}
        EVALPORT_VALIDATE_BIN: ${{ steps.install.outputs.bin }}
      run: |
        set -euo pipefail
        # Split on whitespace WITHOUT shell globbing (set -f): patterns are
        # passed through literally and expanded by evalport-validate itself,
        # which is what makes `**` recurse regardless of the shell's globstar.
        set -f
        # shellcheck disable=SC2206
        patterns=($FILES)
        set +f
        if [ ${#patterns[@]} -eq 0 ]; then
          echo "::error title=EvalPort::the 'files' input is empty"
          exit 2
        fi
        extra=()
        case "$ALLOW_UNKNOWN" in
          true|True|TRUE) extra+=(--allow-unknown) ;;
          false|False|FALSE|'') ;;
          *) echo "::error title=EvalPort::the 'allow-unknown' input must be 'true' or 'false', got '$ALLOW_UNKNOWN'"; exit 2 ;;
        esac
        "$EVALPORT_VALIDATE_BIN" --format github --type "$DOC_TYPE" "${extra[@]}" "${patterns[@]}"
