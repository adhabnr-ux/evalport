name: Croissant Tasks example

on:
  push:
    branches: [main]
    paths:
      - 'examples/croissant/**'
      - 'examples/basic-suite.json'
      - 'examples/results.json'
      - 'sdk/python/**'
      - '.github/workflows/croissant-example.yml'
  pull_request:
    paths:
      - 'examples/croissant/**'
      - 'examples/basic-suite.json'
      - 'examples/results.json'
      - 'sdk/python/**'
      - '.github/workflows/croissant-example.yml'

jobs:
  croissant-tasks:
    # examples/croissant/ -- EvalPort Suite + ResultSet -> MLCommons Croissant
    # Tasks JSON-LD, validated against the vendored Croissant Tasks SHACL
    # shapes with pyshacl (same call as mlcommons/croissant tasks/validator.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evalport-sdk and the SHACL toolchain
        run: pip install -e sdk/python -r examples/croissant/requirements.txt
      - name: Run the exporter tests
        run: python -m pytest -p no:cacheprovider examples/croissant -v
