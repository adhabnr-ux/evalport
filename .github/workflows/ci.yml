name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate JSON Schemas against the Draft 2020-12 meta-schema
        # Not just "is this valid JSON" -- actually checks each file is a
        # structurally valid JSON Schema (Draft202012Validator.check_schema),
        # and that suite.json/testcase.json's $ref to grader.json/testcase.json
        # resolve. A schema can be syntactically valid JSON while being a
        # broken JSON Schema (e.g. a typo'd keyword or malformed `allOf`); this
        # step is what actually catches that class of error in CI.
        run: |
          cat > /tmp/validate_schemas.py << 'PYEOF'
          import json
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          names = ["suite", "testcase", "grader", "resultset"]
          schemas = {}
          for name in names:
              with open(f"spec/schemas/{name}.json") as f:
                  schemas[name] = json.load(f)

          registry = Registry().with_resources(
              [(s["$id"], Resource.from_contents(s)) for s in schemas.values()]
          )

          for name, schema in schemas.items():
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema, registry=registry)
              # Force $ref resolution (e.g. suite.json -> grader.json/testcase.json)
              # by running an empty-object instance through the validator once.
              list(validator.iter_errors({}))
              nprops = len(schema.get("properties", {}))
              print(f"OK {name}.json is a valid Draft 2020-12 schema with {nprops} properties, all $refs resolve")
          PYEOF
          python3 /tmp/validate_schemas.py
      - name: Cross-check schemas against the top-level schema/ mirror
        run: |
          for f in suite testcase grader resultset; do
            diff "spec/schemas/${f}.json" "schema/${f}.json" || (echo "::error::schema/${f}.json is out of sync with spec/schemas/${f}.json" && exit 1)
          done
          echo "✓ schema/ mirror is byte-identical to spec/schemas/"
      - name: Cross-check root doc mirrors against spec/
        # spec/ is canonical; the root copies are mirrors. CRITIQUE.md once
        # drifted (a correction landed only in the root copy), so fail fast.
        run: |
          for f in SPEC.md CRITIQUE.md ADOPTION.md; do
            diff "spec/${f}" "${f}" > /dev/null || (echo "::error::${f} is out of sync with spec/${f}" && exit 1)
          done
          echo "✓ root SPEC.md/CRITIQUE.md/ADOPTION.md are byte-identical to spec/"

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install
      - name: Run tests
        working-directory: sdk/typescript
        run: npm test

  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: cli
        run: npm install
      - name: Typecheck
        working-directory: cli
        run: npm run typecheck
      - name: Run tests (unit + mocked-API — no live keys used)
        working-directory: cli
        run: npm test

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        working-directory: sdk/python
        run: pip install -e ".[test]"
      - name: Run tests
        working-directory: sdk/python
        run: python -m pytest tests/ -v

  adapter-tests:
    # Runs every adapters/*/ package's own test suite, so an adapter can't
    # silently rot against the SDK/validator on this same commit. "Min mode":
    # only pytest + this commit's sdk/python are installed -- never the
    # upstream framework an adapter targets (65+ frameworks, several of them
    # heavy or conflicting, can't share one environment). Each adapter is
    # installed with --no-deps for the same reason: a few (dspy, evidently,
    # guardrails, haystack, agenta, argilla) hard-depend on their framework.
    # Framework-dependent tests are therefore expected to skip themselves
    # (a find_spec-based skipif marker, or a module-level pytest.skip), while
    # every framework-free test runs and must pass -- see .github/CONTRIBUTING.md.
    # Adapter directories are discovered by glob, so a new adapter is covered
    # automatically; the only exclusions are the explicit SKIP list below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest + evalport-sdk (this commit's sdk/python)
        run: pip install pytest -e sdk/python
      - name: Run every adapter's test suite (evalport-sdk only)
        # Deliberately not `set -e`: every adapter runs even after one fails,
        # and the step exits non-zero at the end listing all of them.
        run: |
          set +e -uo pipefail  # GitHub runs bash with -e by default; undo it
          # Adapters whose tests cannot run in this job at all. Every entry
          # needs a reason; anything else that fails here is a real failure.
          SKIP=(
            # Tests import the real GeoBenchX classes (geobenchx.dataclasses,
            # geobenchx.constants). GeoBenchX is not on PyPI: it needs a manual
            # git clone on sys.path (see its tests/conftest.py).
            geobenchx-openeval-adapter
            # requires-python >=3.12 (giskard-checks needs it), so it can't be
            # installed on this job's 3.11 at all. Its only test module also
            # importorskips giskard_checks, so min mode would run 0 tests.
            giskard-openeval-adapter
          )
          sdk_version=$(python -c "from importlib.metadata import version; print(version('evalport-sdk'))")
          failed=()
          rows=()
          start_all=$SECONDS
          for dir in adapters/*/; do
            dir=${dir%/}
            name=$(basename "$dir")
            [ -f "$dir/pyproject.toml" ] || continue
            if printf '%s\n' "${SKIP[@]}" | grep -qxF "$name"; then
              rows+=("$name|skipped (SKIP list)|-|-")
              continue
            fi
            start=$SECONDS
            echo "::group::$name"
            status=""
            counts="-"
            # --no-deps skips evalport-sdk too, so check the adapter's own
            # evalport-sdk requirement accepts this commit's SDK explicitly.
            if ! python - "$dir/pyproject.toml" "$sdk_version" <<'PYEOF'
          import sys, tomllib
          from packaging.requirements import Requirement
          reqs = [Requirement(r) for r in tomllib.load(open(sys.argv[1], "rb"))["project"].get("dependencies", [])]
          sdk = [r for r in reqs if r.name == "evalport-sdk"]
          if not sdk:
              sys.exit("does not declare an evalport-sdk dependency")
          if not sdk[0].specifier.contains(sys.argv[2], prereleases=True):
              sys.exit(f"requires {sdk[0]}, but this commit's SDK is {sys.argv[2]}")
          PYEOF
            then
              status="FAILED (evalport-sdk requirement)"
            elif ! pip install --quiet --no-deps -e "$dir"; then
              status="FAILED (pip install)"
            else
              (cd "$dir" && timeout 300 python -m pytest -q -p no:cacheprovider --rootdir . tests) 2>&1 | tee /tmp/adapter-pytest.log
              rc=${PIPESTATUS[0]}
              # pytest's own final line, e.g. "20 passed, 5 skipped".
              counts=$(tail -n 1 /tmp/adapter-pytest.log | sed -E 's/ in [0-9.]+s.*$//; s/^[= ]+//')
              case $rc in
                0) case $counts in *passed*) status="passed" ;; *) status="all skipped (needs framework)" ;; esac ;;
                # Exit 5 = nothing collected: the whole module skipped itself
                # because its framework is absent (e.g. the adapter imports it).
                5) status="all skipped (needs framework)" ;;
                124) status="FAILED (timeout after 300s)" ;;
                *) status="FAILED (pytest exit $rc)" ;;
              esac
            fi
            echo "::endgroup::"
            case $status in FAILED*) failed+=("$name") ;; esac
            rows+=("$name|$status|$counts|$((SECONDS - start))")
          done

          summary=${GITHUB_STEP_SUMMARY:-/dev/null}
          {
            echo "### Adapter tests (min mode: evalport-sdk $sdk_version only)"
            echo
            echo "| adapter | result | tests | seconds |"
            echo "|---|---|---|---|"
            for row in "${rows[@]}"; do echo "| ${row//|/ | } |"; done
          } >> "$summary"
          printf '\n%-42s %-31s %-34s %s\n' ADAPTER RESULT TESTS SECONDS
          for row in "${rows[@]}"; do
            IFS='|' read -r n s c t <<< "$row"
            printf '%-42s %-31s %-34s %s\n' "$n" "$s" "$c" "$t"
          done
          echo
          echo "${#rows[@]} adapters, ${#failed[@]} failed, $((SECONDS - start_all))s total"
          if [ ${#failed[@]} -gt 0 ]; then
            for name in "${failed[@]}"; do echo "::error::adapter tests failed: $name"; done
            exit 1
          fi

  conformance-suite:
    # Discussion #9 / spec/conformance/ -- runs every portable fixture in
    # spec/conformance/fixtures/*.json through the real hand-rolled Python
    # validator and fails the build if any fixture's own expect.valid claim
    # doesn't hold. Separate job (not folded into python-tests) because these
    # fixtures are the portable, language-agnostic artifact this repo ships
    # for third-party (non-Python, non-TypeScript) runners to test against --
    # keeping it as its own CI job makes that scope explicit rather than
    # burying it inside the Python SDK's own pytest run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run conformance fixtures against the reference Python validator
        run: python3 spec/conformance/run.py

  validate-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evalport-sdk
        working-directory: sdk/python
        run: pip install -e .
      - name: Validate every benchmark suite against the real EvalPort validator
        run: python3 benchmarks/_tools/validate_all.py

  verify-signature-tool:
    # Discussion #8 / spec/tools/verify_signature.py -- regression-tests the
    # signature verifier itself against real, independently-published
    # Sigstore bundles (see spec/tools/tests/fixtures/NOTICE.md for exact
    # provenance). Runs on every push/PR, independent of sign-benchmarks
    # below (which only runs on a real release, and needs this script to
    # already be correct before it's trusted to gate that release).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sigstore + pytest
        run: pip install sigstore pytest
      - name: Run verify_signature.py's own test suite
        run: python -m pytest spec/tools/tests/ -v

  sign-benchmarks:
    # Discussion #8 -- signs every benchmark suite in this release with a
    # keyless Sigstore signature, so a consumer who downloaded a suite from
    # somewhere other than a direct git clone of this repo (a mirror, a
    # package registry, a copy in someone else's project) can verify it
    # wasn't tampered with. spec/tools/verify_signature.py is the reference
    # verifier a consumer runs; spec/SPEC.md's Extension Mechanism ->
    # Suite/ResultSet Signing is the normative convention this implements.
    # Uses the exact same GitHub Actions OIDC trust root as publish-npm and
    # publish-pypi's Trusted Publishing below -- no long-lived signing key
    # exists anywhere for anyone to leak, rotate, or revoke. Signing is
    # optional and out-of-band: nothing in validate-benchmarks above (or any
    # EvalPort validator) depends on or checks for a signature.
    needs: [validate-benchmarks, verify-signature-tool]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # exchanged for a short-lived Fulcio cert per file signed
      contents: write  # to attach the signature bundle archive to this release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sigstore
        run: pip install sigstore
      - name: Sign every benchmark suite (detached bundle, raw published bytes)
        # sigstore's CLI auto-detects the GitHub Actions ambient OIDC
        # credential from the environment variables the id-token: write
        # permission above causes GitHub to set -- no explicit token
        # handling needed here, the same way publish-pypi/publish-npm below
        # need no PYPI_TOKEN/NPM_TOKEN. `--bundle` only supports one input
        # file at a time (sigstore's own CLI restriction), hence the loop
        # rather than one `sigstore sign` call across all 22 suites.
        run: |
          set -euo pipefail
          mkdir -p /tmp/signed-benchmarks
          find benchmarks -name '*.json' -print0 | while IFS= read -r -d '' f; do
            rel="${f#benchmarks/}"
            out="/tmp/signed-benchmarks/${rel}.sigstore.json"
            mkdir -p "$(dirname "$out")"
            python -m sigstore sign --bundle "$out" "$f"
            echo "signed: $f -> $out"
          done
      - name: Self-verify every signature just produced
        # Round-trips every bundle through the same reference verifier a
        # real consumer uses, checked against this exact workflow's own
        # identity (github.workflow_ref is already formatted as
        # "OWNER/REPO/.github/workflows/ci.yml@REF"). Catches a signing
        # misconfiguration here, before anything is published as a release
        # asset, rather than letting a consumer discover it later.
        run: |
          set -euo pipefail
          find benchmarks -name '*.json' -print0 | while IFS= read -r -d '' f; do
            rel="${f#benchmarks/}"
            python3 spec/tools/verify_signature.py verify "$f" \
              --bundle "/tmp/signed-benchmarks/${rel}.sigstore.json" \
              --cert-identity "https://github.com/${{ github.workflow_ref }}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Package signature bundles
        working-directory: /tmp/signed-benchmarks
        run: tar czf "/tmp/benchmark-signatures-${{ github.event.release.tag_name }}.tar.gz" .
      - name: Attach signature bundle archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "/tmp/benchmark-signatures-${{ github.event.release.tag_name }}.tar.gz" \
            --repo "${{ github.repository }}" \
            --clobber

  publish-npm:
    needs: [validate-schemas, typescript-tests]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing: no NPM_TOKEN secret needed. Requires this
    # workflow (owner/repo/ci.yml) to be registered as a trusted publisher
    # on the package's npm settings page. See docs.npmjs.com trusted publishers.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm to a version that supports OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Publish
        working-directory: sdk/typescript
        run: npm publish --access public

  publish-pypi:
    needs: [validate-schemas, python-tests]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing: no PYPI_TOKEN secret needed. Requires this
    # workflow (owner/repo/.github/workflows/ci.yml) to be registered as a
    # trusted publisher on the project's PyPI Publishing settings, scoped to
    # the "pypi" GitHub Environment below. See docs.pypi.org/trusted-publishers/.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        working-directory: sdk/python
        run: |
          pip install build
          python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          # A version already on PyPI can never be re-uploaded (immutable),
          # so a re-run of this job against a version this workflow already
          # published successfully (e.g. because a sibling job like
          # publish-npm failed and the release needs a partial re-run) skips
          # cleanly instead of hard-failing the whole run.
          skip-existing: true
