name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate JSON Schemas against the Draft 2020-12 meta-schema
        # Not just "is this valid JSON" -- actually checks each file is a
        # structurally valid JSON Schema (Draft202012Validator.check_schema),
        # and that suite.json/testcase.json's $ref to grader.json/testcase.json
        # resolve. A schema can be syntactically valid JSON while being a
        # broken JSON Schema (e.g. a typo'd keyword or malformed `allOf`); this
        # step is what actually catches that class of error in CI.
        run: |
          cat > /tmp/validate_schemas.py << 'PYEOF'
          import json
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          names = ["suite", "testcase", "grader", "resultset"]
          schemas = {}
          for name in names:
              with open(f"spec/schemas/{name}.json") as f:
                  schemas[name] = json.load(f)

          registry = Registry().with_resources(
              [(s["$id"], Resource.from_contents(s)) for s in schemas.values()]
          )

          for name, schema in schemas.items():
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema, registry=registry)
              # Force $ref resolution (e.g. suite.json -> grader.json/testcase.json)
              # by running an empty-object instance through the validator once.
              list(validator.iter_errors({}))
              nprops = len(schema.get("properties", {}))
              print(f"OK {name}.json is a valid Draft 2020-12 schema with {nprops} properties, all $refs resolve")
          PYEOF
          python3 /tmp/validate_schemas.py
      - name: Cross-check schemas against the top-level schema/ mirror
        run: |
          for f in suite testcase grader resultset; do
            diff "spec/schemas/${f}.json" "schema/${f}.json" || (echo "::error::schema/${f}.json is out of sync with spec/schemas/${f}.json" && exit 1)
          done
          echo "✓ schema/ mirror is byte-identical to spec/schemas/"

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install
      - name: Run tests
        working-directory: sdk/typescript
        run: npm test

  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: cli
        run: npm install
      - name: Typecheck
        working-directory: cli
        run: npm run typecheck
      - name: Run tests (unit + mocked-API — no live keys used)
        working-directory: cli
        run: npm test

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        working-directory: sdk/python
        run: pip install -e ".[test]"
      - name: Run tests
        working-directory: sdk/python
        run: python -m pytest tests/ -v

  validate-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evalport-sdk
        working-directory: sdk/python
        run: pip install -e .
      - name: Validate every benchmark suite against the real EvalPort validator
        run: python3 benchmarks/_tools/validate_all.py

  publish-npm:
    needs: [validate-schemas, typescript-tests]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        working-directory: sdk/typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: [validate-schemas, python-tests]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and publish
        working-directory: sdk/python
        run: |
          pip install build twine
          python -m build
          twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}
