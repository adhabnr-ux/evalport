name: Assemble SPEC.md from staged chunks (temporary fix-forward helper)

on:
  push:
    branches:
      - rfc-45-grouped-resultset-reference
    paths:
      - 'spec/.spec_chunks/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rfc-45-grouped-resultset-reference
          fetch-depth: 0

      - name: Check all 8 chunks are present
        id: check
        run: |
          set -euo pipefail
          count=0
          for i in 1 2 3 4 5 6 7 8; do
            if [ -f "spec/.spec_chunks/part_${i}.b64" ]; then
              count=$((count+1))
            fi
          done
          echo "Found $count/8 chunk files"
          if [ "$count" -eq 8 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble, decode, and verify
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cat spec/.spec_chunks/part_1.b64 \
              spec/.spec_chunks/part_2.b64 \
              spec/.spec_chunks/part_3.b64 \
              spec/.spec_chunks/part_4.b64 \
              spec/.spec_chunks/part_5.b64 \
              spec/.spec_chunks/part_6.b64 \
              spec/.spec_chunks/part_7.b64 \
              spec/.spec_chunks/part_8.b64 > /tmp/assembled.b64
          base64 -d /tmp/assembled.b64 > /tmp/SPEC_new.md
          bytes=$(wc -c < /tmp/SPEC_new.md)
          echo "Decoded spec/SPEC.md is $bytes bytes"
          sha=$(git hash-object /tmp/SPEC_new.md)
          echo "Computed git blob sha: $sha"
          expected="6cf1b67bcfe79659b0765f2e15f551d23ec12c81"
          if [ "$sha" != "$expected" ]; then
            echo "::error::Blob sha mismatch! got $sha expected $expected"
            exit 1
          fi
          echo "Blob sha matches expected value. Proceeding."
          cp /tmp/SPEC_new.md spec/SPEC.md
          rm -rf spec/.spec_chunks
          rm -f .github/workflows/assemble-spec-tmp.yml

      - name: Commit and push corrected spec/SPEC.md
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: restore full spec/SPEC.md content on top of corrupted commit a04f298

The commit a04f298b56c5c466d667df60e48ced9235aac2a8 on this branch truncated
spec/SPEC.md to 10185 bytes (from the correct 112714 bytes), corrupting the
Vertex AI Vizier / google-vizier citation section added for RFC #45. This is
a fix-forward commit restoring the correct, byte-verified full content
(git blob sha 6cf1b67bcfe79659b0765f2e15f551d23ec12c81) rather than a history
rewrite, per repository policy of never force-pushing shared branches.

Assembled server-side by this temporary GitHub Actions workflow from 8
staged base64 chunks (spec/.spec_chunks/part_1.b64..part_8.b64), which are
removed in this same commit along with the workflow file itself, since both
were staging scaffolding rather than permanent repository content.

