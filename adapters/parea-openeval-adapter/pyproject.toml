[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parea-openeval-adapter"
version = "0.1.0"
description = "Convert Parea AI evaluation suites and results to/from the EvalPort open standard"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Vimal Sahani"}]
keywords = ["parea", "parea-ai", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/parea-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# `tqdm` works around an upstream packaging gap, not a need of this adapter
# (which never imports tqdm): parea-ai==0.2.220 (latest as of 2026-09-27)
# does `from tqdm import tqdm` in parea/experiment/experiment.py, reached from
# `import parea`, but does not declare tqdm in its own dependencies -- so in
# a fresh venv `import parea` raises ModuleNotFoundError: No module named 'tqdm'.
parea = ["parea-ai>=0.2.220", "tqdm"]
test = ["pytest", "parea-openeval-adapter[parea]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

