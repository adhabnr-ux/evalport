[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beeai-openeval-adapter"
version = "0.1.0"
description = "Convert BeeAI Framework evaluation datasets and AgentOutput/RequirementAgentOutput runs to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["beeai", "beeai-framework", "evalport", "openeval", "llm", "agents", "evaluation", "eval"]
classifiers = [
"License :: OSI Approved :: Apache Software License",
"Programming Language :: Python :: 3",
"Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/beeai-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"
Upstream = "https://github.com/i-am-bee/beeai-framework"

# Pinned to the real installed/tested surface (beeai-framework==0.1.84, which
# itself requires Python >=3.11): AgentOutput from beeai_framework.agents,
# RequirementAgentOutput / RequirementAgentRunState from
# beeai_framework.agents.requirement.types, and the message classes in
# beeai_framework.backend. The adapter itself never imports `beeai_framework`
# at runtime (it duck-types the objects the caller passes in), so the extra
# is for users who also want the real SDK installed alongside it. `test`
# self-references it so tests/test_adapter.py's real-object tests (which
# construct AgentOutput/RequirementAgentOutput offline) run rather than skip.
[project.optional-dependencies]
beeai = ["beeai-framework>=0.1.84,<1"]
test = ["pytest", "beeai-openeval-adapter[beeai]"]

[tool.setuptools.packages.find]
where = ["src"]
