[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galileo-openeval-adapter"
version = "0.1.0"
description = "Convert Galileo's Dataset content and LocalMetric-scored Trace/Span objects to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["galileo", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/galileo-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

# Pinned to the real installed/tested surface (galileo==2.6.0, the current
# `rungalileo/galileo-python` package -- NOT the legacy `promptquality`
# distribution, which is a different, older client for the same platform):
# Dataset, Trace, LlmSpan, Message, LocalMetric from the top-level `galileo`
# package. This adapter itself never imports `galileo` at runtime (it
# converts already-constructed objects/plain dicts the caller passes in), so
# the extra is for users who also want the real SDK installed alongside it.
[project.optional-dependencies]
galileo = ["galileo>=2.0.0,<3"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
