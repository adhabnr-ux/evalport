[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "braintrust-openeval-adapter"
version = "0.1.0"
description = "Convert Braintrust Eval() results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["braintrust", "evalport", "openeval", "llm", "evaluation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/braintrust-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# braintrust-openeval-adapter's to_openeval()/from_openeval() are duck-typed against
# braintrust's public object/dict shapes (attribute- and key-based access) rather than
# importing the real package directly, so braintrust was never a hard or test
# dependency and this adapter's own tests build hand-rolled stand-in fixtures instead
# of real braintrust objects -- that design choice is unchanged by this extra.
# This named extra exists purely for downstream convenience: `pip install
# braintrust-openeval-adapter[braintrust]` gets you a real, version-constrained braintrust install
# alongside the adapter, the same discoverable pattern every other adapter in this
# repo offers, per https://github.com/adhabnr-ux/evalport/discussions/13. Verified
# 2026-08-23: fresh venv install of braintrust==0.34.0 (current PyPI release)
# alongside this adapter resolves cleanly with no conflicts, and the adapter's own
# test suite still passes unchanged with the real package present.
braintrust = ["braintrust>=0.34.0"]
test = ["pytest", "braintrust-openeval-adapter[braintrust]"]

[tool.setuptools.packages.find]
where = ["src"]
