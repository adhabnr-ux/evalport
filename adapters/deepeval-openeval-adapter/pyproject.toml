[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepeval-openeval-adapter"
version = "0.2.0"
description = "Convert DeepEval's LLMTestCase/TestResult/MetricData to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["deepeval", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/deepeval-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

# Pinned to the real installed/tested surface (deepeval==4.1.10, re-tested on
# 4.2.6): LLMTestCase, ToolCall, TestResult, MetricData, EvaluationResult,
# BaseMetric from deepeval.test_case / deepeval.evaluate.types /
# deepeval.test_run.api / deepeval.metrics. deepeval stays optional: the
# adapter imports it lazily, only to wrap tool names in ToolCall in
# from_openeval() (skipped when it isn't installed) and to build metrics in
# graders_to_deepeval_metrics() / to_tool_calls() (ImportError without it).
[project.optional-dependencies]
deepeval = ["deepeval>=4.0.0,<5"]
# test self-references the deepeval extra (.github/CONTRIBUTING.md convention),
# so a full `pip install -e ".[test]"` -- what publish-adapter.yml runs --
# exercises the real-deepeval tests instead of silently skipping them.
test = ["pytest", "deepeval-openeval-adapter[deepeval]"]

[tool.setuptools.packages.find]
where = ["src"]
