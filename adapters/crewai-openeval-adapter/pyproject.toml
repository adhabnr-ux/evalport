[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-openeval-adapter"
version = "0.1.0"
description = "Convert CrewAI crew/task eval results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["crewai", "evalport", "openeval", "llm", "evaluation", "agents", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/crewai-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# crewai-openeval-adapter's to_openeval()/from_openeval() are duck-typed against
# crewai's public object/dict shapes (attribute- and key-based access) rather than
# importing the real package directly, so crewai was never a hard or test
# dependency and this adapter's own tests build hand-rolled stand-in fixtures instead
# of real crewai objects -- that design choice is unchanged by this extra.
# This named extra exists purely for downstream convenience: `pip install
# crewai-openeval-adapter[crewai]` gets you a real, version-constrained crewai install
# alongside the adapter, the same discoverable pattern every other adapter in this
# repo offers, per https://github.com/adhabnr-ux/evalport/discussions/13. Verified
# 2026-08-23: fresh venv install of crewai==1.15.17 (current PyPI release)
# alongside this adapter resolves cleanly with no conflicts, and the adapter's own
# test suite still passes unchanged with the real package present.
crewai = ["crewai>=1.15.17"]
test = ["pytest", "crewai-openeval-adapter[crewai]"]

[tool.setuptools.packages.find]
where = ["src"]
