[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencompass-openeval-adapter"
version = "0.1.0"
description = "Convert OpenCompass CustomDataset rows and real evaluator scoring output to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["opencompass", "open-compass", "evalport", "openeval", "llm", "evaluation", "eval", "benchmark"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/opencompass-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# Verified 2026-08-21: fresh venv `pip install opencompass==0.5.3` (the real, current
# PyPI release) + `pip install -e ".[test]"` + `pytest tests/ -v` resolved and passed,
# calling the real opencompass.datasets.custom.CustomDataset.load(), the real
# opencompass.datasets.custom.OptionSimAccEvaluator, and the real
# opencompass.openicl.icl_evaluator.AccEvaluator directly -- not mocks.
opencompass = ["opencompass>=0.5.0"]
test = ["pytest", "opencompass>=0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]
