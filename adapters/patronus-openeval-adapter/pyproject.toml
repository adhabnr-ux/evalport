[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patronus-openeval-adapter"
version = "0.1.0"
description = "Convert Patronus AI evaluation inputs, evaluators, and results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["patronus", "patronus-ai", "evalport", "openeval", "llm", "evaluation", "eval", "llm-testing", "llm-judge"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/patronus-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# Real, version-constrained install for anyone actually using this adapter --
# `pip install patronus-openeval-adapter[patronus]`. Reuses the exact range
# already pinned (and tested against) in `test` below; see EvalPort
# Discussion #13 for the convention this follows.
patronus = ["patronus>=0.1.0"]
test = ["pytest", "patronus-openeval-adapter[patronus]"]

[tool.setuptools.packages.find]
where = ["src"]
