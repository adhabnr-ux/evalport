[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "literalai-openeval-adapter"
version = "0.1.0"
description = "Convert Literal AI datasets and experiment results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sidd-1507"}]
keywords = ["literalai", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
"License :: OSI Approved :: Apache Software License",
"Programming Language :: Python :: 3",
"Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/literalai-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
test = ["pytest", "literalai>=0.1.300"]

[tool.setuptools.packages.find]
where = ["src"]
