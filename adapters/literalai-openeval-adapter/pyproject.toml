[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "literalai-openeval-adapter"
version = "0.1.0"
description = "Convert Literal AI datasets and experiment results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sidd-1507"}]
keywords = ["literalai", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
"License :: OSI Approved :: Apache Software License",
"Programming Language :: Python :: 3",
"Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/literalai-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# Named, pinned extra per .github/CONTRIBUTING.md (test self-references it
# rather than duplicating the version string). `requests` works around an
# upstream packaging gap, not a need of this adapter (which never imports
# requests or literalai at runtime): literalai==0.1.300 imports traceloop-sdk
# at `import literalai` time, and traceloop-sdk==0.62.3 (latest as of
# 2026-09-27) does `import requests` in traceloop/sdk/images/image_uploader.py
# without declaring requests in its own dependencies -- so in a fresh venv
# `import literalai` raises ModuleNotFoundError: No module named 'requests'.
literalai = ["literalai>=0.1.300", "requests"]
test = ["pytest", "literalai-openeval-adapter[literalai]"]

[tool.setuptools.packages.find]
where = ["src"]
