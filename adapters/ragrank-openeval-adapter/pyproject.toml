[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragrank-openeval-adapter"
version = "0.1.0"
description = "Convert ragrank evaluation results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["ragrank", "evalport", "openeval", "llm", "rag", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/ragrank-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"
Tracking-Issue = "https://github.com/izam-mohammed/ragrank/issues/63"

[project.optional-dependencies]
# to_openeval() is duck-typed against ragrank's public EvalResult/DataNode/
# BaseMetric attribute shapes (dict- or attribute-based access) rather than
# importing ragrank directly, so it works without ragrank installed at all
# -- this adapter's own tests build real ragrank objects (see the `test`
# extra) rather than relying on that duck-typing being untested, though.
# from_openeval() *does* import ragrank directly (it has to construct a
# real Dataset/DataNode), so it requires this extra.
#
# Verified 2026-08-31: fresh venv install of ragrank==0.0.10 (current PyPI
# release) alongside this adapter resolves cleanly with no conflicts, and
# ragrank==0.0.10's `EvalResult`/`DataNode`/`BaseMetric` shapes already
# match what izam-mohammed/ragrank#63 described off `main` (results,
# usage, score_range, DataNode.reference/retrieved_ids/reference_ids all
# present) -- this adapter was built and tested against that release.
ragrank = ["ragrank>=0.0.10"]
test = ["pytest", "ragrank-openeval-adapter[ragrank]"]

[tool.setuptools.packages.find]
where = ["src"]
