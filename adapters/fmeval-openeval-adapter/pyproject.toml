[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmeval-openeval-adapter"
version = "0.1.0"
description = "Convert AWS fmeval (Foundation Model Evaluations) datasets and evaluation output to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["fmeval", "aws", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/fmeval-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# fmeval-openeval-adapter's tests run real fmeval algorithms
# (fmeval.eval_algorithms.factual_knowledge.FactualKnowledge) end to end
# against a real installed `fmeval` package and read the real per-record
# JSON Lines it writes -- not mocks or hand-typed fixtures -- so `fmeval`
# is a genuine test dependency. Verified 2026-09-11: fresh venv
# `pip install -e ".[test]"` resolved fmeval==1.2.3 (current PyPI release)
# and `pytest tests/` passed. Self-referencing per the packaging convention
# settled in https://github.com/adhabnr-ux/evalport/discussions/13.
fmeval = ["fmeval>=1.0.0"]
test = ["pytest", "fmeval-openeval-adapter[fmeval]"]

[tool.setuptools.packages.find]
where = ["src"]
