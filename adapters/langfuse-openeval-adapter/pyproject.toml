[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langfuse-openeval-adapter"
version = "0.1.0"
description = "Convert Langfuse datasets and experiment results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["langfuse", "evalport", "openeval", "llm", "evaluation", "eval", "observability"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/langfuse-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# Verified 2026-08-20: fresh venv `pip install -e ".[test]"` + `pytest tests/ -v`
# resolved langfuse==4.14.4 and passed 26/26. See EvalPort Discussion #13 /
# Issue #14 for the named-extra-reusing-test's-pin convention this follows.
langfuse = ["langfuse>=4.14.4"]
test = ["pytest", "langfuse>=4.14.4"]

[tool.setuptools.packages.find]
where = ["src"]
