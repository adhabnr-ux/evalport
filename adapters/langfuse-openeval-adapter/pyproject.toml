[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langfuse-openeval-adapter"
version = "0.1.0"
description = "Convert Langfuse datasets and experiment results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["langfuse", "evalport", "openeval", "llm", "evaluation", "eval", "observability"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/langfuse-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# Real install for anyone actually using this adapter --
# `pip install langfuse-openeval-adapter[langfuse]`. No version range was
# pinned in `test` either, so none is invented here -- see EvalPort
# Discussion #13 (and Issue #14) for tightening this to a real range once
# it's verified.
langfuse = ["langfuse"]
test = ["pytest", "langfuse"]

[tool.setuptools.packages.find]
where = ["src"]
