[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidently-openeval-adapter"
version = "0.1.0"
description = "Convert Evidently evaluation DataFrames/Datasets to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0", "evidently>=0.4.25", "pandas>=1.5"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["evidently", "evidentlyai", "evalport", "openeval", "llm", "evaluation", "eval", "llm-testing", "observability"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/evidently-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# No named `evidently` extra here (unlike most other adapters) because evidently is
# already a required base dependency above (`evidently>=0.4.25`), not optional -- this
# adapter imports real Evidently Dataset/descriptor types directly rather than
# duck-typing against their shapes, so there is no separate version string to
# de-duplicate into a self-referencing extra per
# https://github.com/adhabnr-ux/evalport/discussions/13; `pip install -e ".[test]"`
# already pulls in the pinned evidently transitively via `dependencies`. Re-verified
# 2026-08-23 in a fresh venv: resolved evidently==0.7.21 (current PyPI release, well
# above the >=0.4.25 floor) and passed 44/44.
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
