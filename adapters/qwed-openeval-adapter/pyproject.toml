[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwed-openeval-adapter"
version = "0.1.0"
description = "Convert QWED Verification Context v1.0 documents to/from the EvalPort open evaluation format, keeping QWED's verdict and admission as independent graders"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["qwed", "verification", "verification-context", "evalport", "openeval", "llm", "evaluation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/qwed-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"
Upstream = "https://github.com/QWED-AI/qwed-verification"
Design = "https://github.com/QWED-AI/qwed-verification/issues/325"

# Built following the design approved by the QWED maintainer in
# https://github.com/QWED-AI/qwed-verification/issues/325.
#
# Depends only on QWED's versioned Verification Context v1.0 contract (the
# JSON document emitted by QWEDClient.create_verification_context_from_diagnostic,
# POST /verification-context/from-diagnostic, `qwed context from-diagnostic`,
# and qwed_sdk.VerificationContextDocument.to_dict()). Never imports
# qwed_new.*. `qwed` stays optional: when installed, the adapter also runs the
# SDK's exported qwed_sdk.validate_document() (schema + proof_ref commitment).
# Tested against qwed 7.2.1 from PyPI; Verification Context v1.0 and its
# qwed_sdk re-exports first shipped in qwed 7.1.0.
[project.optional-dependencies]
qwed = ["qwed>=7.1.0,<8"]
# test self-references the qwed extra (.github/CONTRIBUTING.md convention),
# so a full `pip install -e ".[test]"` exercises the real-qwed tests instead
# of silently skipping them. jsonschema drives the raw-JSON-Schema tests.
test = ["pytest", "jsonschema>=4.18", "qwed-openeval-adapter[qwed]"]

[tool.setuptools.packages.find]
where = ["src"]
