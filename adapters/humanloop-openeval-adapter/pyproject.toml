[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "humanloop-openeval-adapter"
version = "0.1.0"
description = "Convert Humanloop datasets and evaluation runs to/from the EvalPort open standard"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Vimal Sahani"}]
keywords = ["humanloop", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
# `requests` works around an upstream packaging gap, not a need of this
# adapter (which never imports requests): humanloop==0.8.38 (latest as of
# 2026-09-27) imports `requests` in humanloop/otel/exporter/__init__.py,
# reached from `import humanloop` via humanloop.client, but does not declare
# it in its own dependencies -- so in a fresh venv `import humanloop` raises
# ModuleNotFoundError: No module named 'requests'.
humanloop = ["humanloop>=0.8.38", "requests"]
test = [
    "pytest>=7.0.0",
    "humanloop-openeval-adapter[humanloop]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
