[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ares-openeval-adapter"
authors = [
    {name = "Sahi Adharva Katukojula"},
]
description = "Convert ARES attack goals / evaluation results to and from EvalPort, the open interchange format for portable LLM evaluation datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "evalport-sdk>=1.0.0",
]
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/ares-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"
Issue = "https://github.com/IBM/ares/issues/563"

[project.optional-dependencies]
# ares_openeval_adapter's to_openeval_suite()/to_openeval_resultset()/from_openeval()
# are duck-typed against ARES's public dataclass/dict shapes (ConnectorResponse,
# AttackGoal.run() output) rather than importing the `ares` package directly, so
# `ares` itself was never a hard dependency -- this adapter's own tests build
# hand-rolled stand-in fixtures instead of a real ARES install (which pulls in
# torch and is not yet published to PyPI). This extra exists purely so a real
# `ares` checkout can be installed alongside the adapter for integration use;
# `ares-redteamer` is not yet on PyPI, so this points at an editable install of
# the parent repo per the ares-contextual-jailbreak plugin's own README.
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
