[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "longtracer-openeval-adapter"
version = "0.1.0"
description = "Convert LongTracer's VerificationResult to the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["longtracer", "evalport", "openeval", "llm", "hallucination-detection", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/longtracer-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"
Issue = "https://github.com/ENDEVSOLS/LongTracer/issues/15"

[project.optional-dependencies]
# to_openeval() is duck-typed against VerificationResult's public attribute/key
# shape rather than importing longtracer directly (see package docstring), so
# longtracer was never a hard or test dependency -- this adapter's own tests
# use a hand-built stand-in dataclass matching the real shape instead of the
# real longtracer package, which pulls in sentence-transformers + torch just
# to define that dataclass. This extra exists purely for downstream
# convenience, matching every other adapter in this repo.
longtracer = ["longtracer>=0.1.0"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
