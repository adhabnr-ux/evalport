[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athina-openeval-adapter"
version = "0.1.0"
description = "Convert Athina's LLM evaluators (DoesResponseAnswerQuery, ContextContainsEnoughInformation, Faithfulness, CustomGrader) to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["athina", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/athina-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

# Pinned to the real installed/tested range for athina's LLM-evaluator surface
# (athina.evals: DoesResponseAnswerQuery, ContextContainsEnoughInformation, Faithfulness,
# CustomGrader) verified against athina==1.7.39. This adapter itself never imports `athina`
# (it converts already-computed DataPoint/LlmEvalResult dicts), so the extra is for users who
# also want the real SDK installed alongside it.
#
# The langchain-community and qdrant-client upper bounds are required, not
# optional style preference: verified 2026-08-23 that a *bare* `pip install
# "athina>=1.7.0,<2"` with no other constraints currently fails at import time
# on a fresh install --
#   ragas 0.2.15 (pulled in transitively by athina) imports
#   langchain_community.chat_models.vertexai, which langchain-community
#   removed in its 0.4.x line, so an unconstrained resolve picks the latest
#   langchain-community (0.4.2) and `import athina` raises ModuleNotFoundError;
#   pinning langchain-community<0.4 fixes that but then exposes a second,
#   independent break: llama-index-vector-stores-qdrant (another athina
#   transitive dependency) imports IDF_EMBEDDING_MODELS from
#   qdrant_client.qdrant_fastembed, which newer qdrant-client dropped, so an
#   unconstrained qdrant-client also fails.
# Both are real upstream packaging gaps in athina-evals' own dependency
# pinning, not anything specific to this adapter -- confirmed by reproducing
# the identical failures with a bare `pip install athina` and no adapter code
# involved at all. langchain-community==0.3.31 + qdrant-client==1.11.3 (both
# resolved automatically by these bounds) import cleanly end to end. Test
# self-references the athina extra (rather than duplicating these version
# strings) per the packaging convention settled in
# https://github.com/adhabnr-ux/evalport/discussions/13.
[project.optional-dependencies]
athina = ["athina>=1.7.0,<2", "langchain-community<0.4", "qdrant-client<1.12"]
test = ["pytest", "athina-openeval-adapter[athina]"]

[tool.setuptools.packages.find]
where = ["src"]
