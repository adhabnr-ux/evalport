[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athina-openeval-adapter"
version = "0.1.0"
description = "Convert Athina's LLM evaluators (DoesResponseAnswerQuery, ContextContainsEnoughInformation, Faithfulness, CustomGrader) to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["athina", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/athina-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

# Pinned to the real installed/tested range for athina's LLM-evaluator surface
# (athina.evals: DoesResponseAnswerQuery, ContextContainsEnoughInformation, Faithfulness,
# CustomGrader) verified against athina==1.7.39. This adapter itself never imports `athina`
# (it converts already-computed DataPoint/LlmEvalResult dicts), so the extra is for users who
# also want the real SDK installed alongside it.
[project.optional-dependencies]
athina = ["athina>=1.7.0,<2"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
