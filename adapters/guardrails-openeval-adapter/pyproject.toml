[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrails-openeval-adapter"
version = "0.1.0"
description = "Convert Guardrails AI Guard validation runs to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0", "guardrails-ai>=0.5.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["guardrails", "guardrails-ai", "evalport", "openeval", "llm", "evaluation", "eval", "llm-testing", "validation", "guardrails"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/guardrails-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# No named `guardrails` extra here (unlike most other adapters) because guardrails-ai
# is already a required base dependency above (`guardrails-ai>=0.5.0`), not optional --
# this adapter imports real Guard/OnFailAction/Validator types directly rather than
# duck-typing against their shapes, so there is no separate version string to
# de-duplicate into a self-referencing extra per
# https://github.com/adhabnr-ux/evalport/discussions/13; `pip install -e ".[test]"`
# already pulls in the pinned guardrails-ai transitively via `dependencies`.
# Re-verified 2026-08-23 in a fresh venv: resolved guardrails-ai==0.11.0 (current PyPI
# release, above the >=0.5.0 floor) and passed 30/30.
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
