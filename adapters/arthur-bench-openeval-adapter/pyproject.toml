[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arthur-bench-openeval-adapter"
version = "0.1.0"
description = "Convert Arthur Bench (arthur-bench) TestSuites, TestRuns, and scoring results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["arthur", "arthur-bench", "evalport", "openeval", "llm", "evaluation", "eval", "llm-testing", "llm-judge"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/arthur-bench-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# Real, version-constrained install for anyone actually using this adapter --
# `pip install arthur-bench-openeval-adapter[arthur-bench]`. Reuses the exact
# range already pinned (and tested against) in `test` below; see EvalPort
# Discussion #13 for the convention this follows.
arthur-bench = ["arthur-bench>=0.3.0"]
test = ["pytest", "arthur-bench>=0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
