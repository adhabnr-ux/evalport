[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertexai-openeval-adapter"
version = "0.1.0"
description = "Convert Vertex AI Gen AI Evaluation Service metrics, instances, and results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["vertexai", "vertex-ai", "google-cloud", "evalport", "openeval", "llm", "evaluation", "eval", "llm-testing", "llm-judge"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/vertexai-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
test = ["pytest", "pandas", "google-cloud-aiplatform[evaluation]>=1.60.0"]

[tool.setuptools.packages.find]
where = ["src"]
