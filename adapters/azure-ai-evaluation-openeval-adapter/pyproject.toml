[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ai-evaluation-openeval-adapter"
version = "0.1.0"
description = "Convert Azure AI Evaluation SDK (azure-ai-evaluation) data, evaluators, and EvaluationResults to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["azure", "azure-ai-evaluation", "microsoft", "evalport", "openeval", "llm", "evaluation", "eval", "llm-testing", "llm-judge"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/azure-ai-evaluation-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# Real, version-constrained install for anyone actually using this adapter --
# `pip install azure-ai-evaluation-openeval-adapter[azure]`. Reuses the exact
# range already pinned (and tested against) in `test` below; see EvalPort
# Discussion #13 for the convention this follows.
azure = ["azure-ai-evaluation>=1.0.0"]
test = ["pytest", "azure-ai-evaluation>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
