[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freeplay-openeval-adapter"
version = "0.1.0"
description = "Convert Freeplay datasets and test suite run results to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["freeplay", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
"License :: OSI Approved :: Apache Software License",
"Programming Language :: Python :: 3",
"Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/freeplay-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# test self-references the freeplay extra (rather than duplicating the
# version string) per the packaging convention settled in
# https://github.com/adhabnr-ux/evalport/discussions/13 -- confirmed
# working with a real `pip install -e ".[test]"` (self-referential extras
# resolve correctly via recursive-extras support in modern pip).
freeplay = ["freeplay>=0.6.0"]
test = ["pytest", "freeplay-openeval-adapter[freeplay]"]

[tool.setuptools.packages.find]
where = ["src"]
