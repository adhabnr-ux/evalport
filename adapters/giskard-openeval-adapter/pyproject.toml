[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "giskard-openeval-adapter"
version = "0.1.0"
description = "Convert Giskard giskard-checks Suites, Scenarios, and SuiteResults to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["giskard", "evalport", "openeval", "llm", "evaluation", "eval", "llm-testing", "red-teaming"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/giskard-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"

[project.optional-dependencies]
# giskard-checks is now on PyPI (verified 2026-08-20) but still pre-1.0 --
# only 1.0.1a1 through 1.0.2rc1 exist, no stable 1.0.x release yet -- and
# requires Python >=3.12. The >=1.0.2rc1 floor (rather than a plain >=1.0.0)
# is required for pip to resolve a pre-release version at all; it's also the
# exact version this adapter is tested against, real install + real pytest
# run, not carried over from an older git-source pin. See EvalPort Discussion
# #13 / Issue #14 for the extras convention this follows.
giskard = ["giskard-checks>=1.0.2rc1"]
test = ["pytest", "pytest-asyncio", "giskard-checks>=1.0.2rc1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
