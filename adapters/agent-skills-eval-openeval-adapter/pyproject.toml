[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills-eval-openeval-adapter"
version = "0.1.0"
description = "Convert agent-skills-eval's on-disk grading/benchmark artifacts to/from the EvalPort open evaluation format"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["evalport-sdk>=1.0.0"]
authors = [{name = "Sahi Adharva Katukojula"}]
keywords = ["agent-skills-eval", "agentskills", "evalport", "openeval", "llm", "evaluation", "eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/adhabnr-ux/evalport"
Source = "https://github.com/adhabnr-ux/evalport/tree/main/adapters/agent-skills-eval-openeval-adapter"
Spec = "https://github.com/adhabnr-ux/evalport/blob/main/spec/SPEC.md"
Upstream = "https://github.com/darkrishabh/agent-skills-eval"

# agent-skills-eval is a Node/TypeScript CLI (npm package "agent-skills-eval"), not a
# Python library, so this adapter has no import-time dependency on it: it reads the
# on-disk JSON artifacts (grading.json / meta.json / benchmark.json / logs / outputs)
# that `agent-skills-eval` writes to its workspace directory, per the shapes pinned
# below -- there is nothing to `pip install` from the upstream project itself.
#
# Pinned against agent-skills-eval 0.1.1 (published) plus the unreleased
# docs/artifact-contract.md / src/grade.ts changes merged in
# https://github.com/darkrishabh/agent-skills-eval/pull/37
# (commit 72c3c65c6472f5d6cbe1f957b33a4d218a3da807, 2026-09-29): grading.json's
# `assertion_results` rows are NOT self-describing (a mix of LLM-judge rubric rows
# and deterministic tool-assertion rows with no `type` field -- see
# docs/artifact-contract.md, "the current grading rows do not label rubric versus
# local tool assertions"). This adapter classifies rows honestly: it only labels a
# row `llm_judge` when the caller supplies the original eval definition
# (`assertions` / `tool_assertions`) to disambiguate; otherwise every row is
# reported as `custom` with `metadata.kind_inferred = False` rather than guessing,
# per the upstream maintainer's explicit request
# (https://github.com/darkrishabh/agent-skills-eval/issues/34#issuecomment-5888398803).
# additive fields on `grading.json` / `meta.json` / `timing.json` beyond the ones
# this adapter reads are ignored, not rejected -- see `_get()` below.
[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
